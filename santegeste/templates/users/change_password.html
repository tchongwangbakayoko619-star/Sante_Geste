{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Modifier le mot de passe" %} - SantéGeste{% endblock title %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-4">
          <h2 class="card-title text-center mb-4">{% translate "Modifier le mot de passe" %}</h2>
          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100 py-2">{% translate "Mettre à jour" %}</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
