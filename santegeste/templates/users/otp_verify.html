{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Vérification OTP" %} - SantéGeste{% endblock title %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-4">
          <h2 class="card-title text-center mb-4">{% translate "Vérification OTP" %}</h2>
          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">{% translate "Valider le code" %}</button>
          </form>
          <div class="text-center border-top pt-3">
            <form method="post" action="{% url 'users:otp-resend' %}">
              {% csrf_token %}
              <button type="submit" class="btn btn-outline-secondary btn-sm">
                {% translate "Renvoyer un nouveau code OTP" %}
              </button>
            </form>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
