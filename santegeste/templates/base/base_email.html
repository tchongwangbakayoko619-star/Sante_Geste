<!DOCTYPE html>
<html lang="fr" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{% block title %}CS² Health{% endblock %}</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #f1f5f9;
      margin: 0;
      padding: 0;
      width: 100% !important;
      color: #1e293b;
    }
    .email-wrapper {
      width: 100%;
      background-color: #f1f5f9;
      padding: 40px 12px;
    }
    .email-container {
      max-width: 580px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      overflow: hidden;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
    }
    .email-header {
      padding: 32px 32px 20px 32px;
      text-align: center;
      background-color: #ffffff;
    }
    .email-body {
      padding: 0 36px 36px 36px;
      line-height: 1.6;
      color: #334155;
      font-size: 15px;
    }
    .email-footer {
      background-color: #f8fafc;
      border-top: 1px solid #e2e8f0;
      padding: 24px 32px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
    }
    .btn-action {
      display: inline-block;
      background-color: #14967F;
      color: #ffffff !important;
      text-decoration: none;
      padding: 13px 32px;
      font-weight: 700;
      font-size: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(20, 150, 127, 0.25);
    }
    .btn-action:hover {
      background-color: #0f7a67;
    }
    .otp-card {
      background-color: #eafaf6;
      border: 2px dashed #14967F;
      border-radius: 14px;
      padding: 22px 20px;
      text-align: center;
      margin: 24px 0;
    }
    .otp-code {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 8px;
      color: #0c4139;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      margin: 6px 0;
    }
    .alert-security {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-left: 4px solid #14967F;
      padding: 14px 16px;
      border-radius: 8px;
      color: #475569;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 24px;
      text-align: left;
    }
    .badge-pill {
      display: inline-block;
      background-color: #eafaf6;
      color: #0f7a67;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.75px;
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid #cbf2e8;
    }
    @media only screen and (max-width: 600px) {
      .email-wrapper { padding: 16px 8px !important; }
      .email-container { border-radius: 12px !important; }
      .email-header { padding: 24px 20px 16px 20px !important; }
      .email-body { padding: 0 20px 28px 20px !important; }
      .otp-code { font-size: 28px !important; letter-spacing: 6px !important; }
      .btn-action { display: block !important; padding: 14px 16px !important; }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <div class="email-wrapper" style="width: 100%; background-color: #f1f5f9; padding: 40px 12px; box-sizing: border-box;">
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 580px; margin: 0 auto;">
      <tr>
        <td>
          <div class="email-container" style="background: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);">
            <!-- Top Primary Color Bar (#14967F) -->
            <div style="height: 4px; background-color: #14967F; width: 100%;"></div>

            <!-- Brand Header -->
            <div class="email-header" style="padding: 32px 32px 20px 32px; text-align: center; background-color: #ffffff;">
              <table role="presentation" border="0" cellpadding="0" cellspacing="0" align="center" style="margin: 0 auto;">
                <tr>
                  <!-- Squircle Icon with Medical Cross / Heartbeat -->
                  <td style="vertical-align: middle; padding-right: 12px;">
                    <div style="width: 44px; height: 44px; background-color: #14967F; border-radius: 12px; display: inline-block; text-align: center; line-height: 44px; box-shadow: 0 4px 10px rgba(20, 150, 127, 0.3);">
                      <svg width="24" height="24" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align: middle; margin-top: -2px;">
                        <path d="M35 15C35 9.477 39.477 5 45 5H55C60.523 5 65 9.477 65 15V35H85C90.523 35 95 39.477 95 45V55C95 60.523 90.523 65 85 65H65V85C65 90.523 60.523 95 55 95H45C39.477 95 35 90.523 35 85V65H15C9.477 65 5 60.523 5 55V45C5 39.477 9.477 35 15 35H35V15Z" fill="#ffffff" />
                        <path d="M12 50H36L44 32L54 68L64 42L70 50H88" stroke="#041f1b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
                      </svg>
                    </div>
                  </td>
                  <!-- Brand Lockup Text -->
                  <td style="vertical-align: middle; text-align: left;">
                    <div style="font-size: 20px; font-weight: 800; color: #0f172a; line-height: 1.1; letter-spacing: -0.5px;">
                      CS<sup style="font-size: 13px; font-weight: 800; color: #14967F; margin-left: 1px;">2</sup> Health
                    </div>
                    <div style="font-size: 11px; color: #14967F; font-weight: 700; letter-spacing: 0.5px; margin-top: 2px;">
                      SANTÉGESTE &bull; PLATEFORME MÉDICALE
                    </div>
                  </td>
                </tr>
              </table>
            </div>

            <!-- Content Area -->
            <div class="email-body" style="padding: 0 36px 36px 36px; line-height: 1.6; color: #334155; font-size: 15px;">
              {% block content %}{% endblock %}
            </div>

            <!-- Footer Area -->
            <div class="email-footer" style="background-color: #f8fafc; border-top: 1px solid #e2e8f0; padding: 24px 32px; text-align: center; font-size: 12px; color: #64748b; line-height: 1.5;">
              <table role="presentation" border="0" cellpadding="0" cellspacing="0" align="center" style="margin: 0 auto 12px auto;">
                <tr>
                  <td style="vertical-align: middle; padding-right: 6px;">
                    <svg width="15" height="15" viewBox="0 0 20 20" fill="#059669" style="vertical-align: middle;">
                      <path fill-rule="evenodd" d="M10 1.944A11.954 11.954 0 012.166 5C2.056 5.649 2 6.319 2 7c0 5.225 3.34 9.67 8 11.317C14.66 16.67 18 12.225 18 7c0-.682-.057-1.35-.166-2.001A11.954 11.954 0 0110 1.944zM11 14a1 1 0 11-2 0 1 1 0 012 0zm0-7a1 1 0 10-2 0v3a1 1 0 102 0V7z" clip-rule="evenodd" />
                    </svg>
                  </td>
                  <td style="font-size: 11px; font-weight: 600; color: #0f766e;">
                    Chiffrement et secret médical garantis
                  </td>
                </tr>
              </table>
              <p style="margin: 0 0 6px 0; font-weight: 600; color: #475569;">
                &copy; {% now "Y" %} CS<sup>2</sup> Health &bull; Tous droits réservés.
              </p>
              <p style="margin: 0; color: #94a3b8; font-size: 11px;">
                Ceci est un message de sécurité automatique, merci de ne pas y répondre directement.
              </p>
            </div>
          </div>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
