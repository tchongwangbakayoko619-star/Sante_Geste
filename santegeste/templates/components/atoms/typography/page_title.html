{# Atom: Page Title #}
{# Props: title, subtitle, badge_text, badge_color #}
<div>
  {% if badge_text %}
    <div class="flex items-center gap-2 mb-1.5">
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-[#14967F]/10 text-[#14967F]">
        <span class="w-1.5 h-1.5 rounded-full bg-[#14967F]"></span>
        {{ badge_text }}
      </span>
    </div>
  {% endif %}
  <h1 class="text-2xl sm:text-3xl font-extrabold text-neutral-900 tracking-tight font-title">
    {{ title }}
  </h1>
  {% if subtitle %}
    <p class="text-xs sm:text-sm text-neutral-500 mt-1">
      {{ subtitle }}
    </p>
  {% endif %}
</div>
