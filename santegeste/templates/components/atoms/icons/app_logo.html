{# Atom: App Logo SantéGeste #}
{# Props: size (sm|md|lg|xl), custom_classes, full #}
{% load static %}
{% with logo_size=size|default:"md" %}
{% if full %}
  <img src="{% static 'images/logo_full.png' %}" alt="SantéGeste - Gestion de Centre de Santé" class="object-contain {% if logo_size == 'sm' %}h-8{% elif logo_size == 'lg' %}h-14{% elif logo_size == 'xl' %}h-18{% else %}h-11{% endif %} w-auto {{ custom_classes|default:'' }}">
{% else %}
  <img src="{% static 'images/logo_icon.png' %}" alt="SantéGeste Logo" class="object-contain select-none {% if logo_size == 'sm' %}w-8 h-8{% elif logo_size == 'lg' %}w-14 h-14{% elif logo_size == 'xl' %}w-16 h-16{% else %}w-11 h-11{% endif %} {{ custom_classes|default:'' }}">
{% endif %}
{% endwith %}
