{# Molecule: Feature Card #}
{# Props: icon_name, title, description, href #}
<div class="p-6 bg-white border border-neutral-200/80 rounded-2xl shadow-xs hover:shadow-md transition-all duration-200 group">
  <div class="w-12 h-12 rounded-xl bg-health-50 border border-health-200 text-[#14967F] flex items-center justify-center mb-4 group-hover:scale-105 transition-transform">
    {% include "components/atoms/icons/icon.html" with name=icon_name size="w-6 h-6" %}
  </div>
  <h3 class="font-title font-bold text-lg text-neutral-900 mb-1">{{ title }}</h3>
  <p class="text-xs sm:text-sm text-neutral-500 leading-relaxed">{{ description }}</p>
  {% if href %}
    <a href="{{ href }}" class="mt-3 inline-flex items-center gap-1 text-xs font-bold text-[#14967F] group-hover:underline">
      <span>Consulter</span> &rarr;
    </a>
  {% endif %}
</div>
